name: rtl_sdk
description: Flutter wrapper for the existing RTL native iOS and Android SDKs.
version: 4.1.0
repository: https://github.com/BOON-Rewards/rtl_flutter_sdk
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.affinaloyalty.rtlsdk.rtl_sdk
        pluginClass: RtlSdkPlugin
      ios:
        pluginClass: RtlSdkPlugin
